services:
  - type: web
    name: gentree-family-api
    env: php
    buildCommand: composer install
    envVars:
      - key: DOCUMENT_ROOT
        value: public
      - key: DB_HOST
        value: ""
      - key: DB_DATABASE
        value: "family_db"
      - key: DB_USERNAME
        value: "root"
      - key: DB_PASSWORD
        value: ""
      - key: JWT_SECRET
        value: "change-me-jwt-secret"
      - key: FIREBASE_CREDENTIALS
        value: ""
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: ap-south-1
